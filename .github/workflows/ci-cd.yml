name: ci-cd

# Pull requests: tests only.  Push to main (or manual run): tests -> build 4 images -> push to ACR -> deploy to Container Apps.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # lets the workflow log in to Azure with OIDC (no Azure password stored in GitHub)

jobs:
  # ---------------------------------------------------------------------------------------------- 1. tests
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.docker.txt

      # requirements.txt is a Windows freeze, so CI installs what the containers install, plus the test tools.
      # CPU-only torch first, same as the Dockerfiles (avoids ~3 GB of CUDA libraries).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements.docker.txt pytest pytest-asyncio

      - name: Run tests
        env:
          ENV: dev
          GROQ__API_KEY: dummy
          GEMINI__API_KEY: dummy
          LITELLM__NUM_RETRIES: "2"        # LiteLLMSettings has no default_factory in AppSettings, so it must be present
          LITELLM__TIMEOUT_S: "20.0"
          AUTH__JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          DATABASE__URL: sqlite+aiosqlite:///./ci_test.db
        run: pytest tests -q

  # ---------------------------------------------------------------------------------------------- 2. build + push
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        service: [gateway, docs, sql, ops]     # image name = opspilot-<service>, Dockerfile = docker/Dockerfile.<service>
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

      - uses: docker/setup-buildx-action@v3

      # Layer cache = the previous :latest image in ACR (inline cache), so a code-only change reuses the torch / model
      # layers instead of reinstalling them. Nothing extra is stored.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/opspilot-${{ matrix.service }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/opspilot-${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/opspilot-${{ matrix.service }}:latest
          cache-to: type=inline

  # ---------------------------------------------------------------------------------------------- 3. deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Render containerapp.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          ENVIRONMENT_ID: ${{ vars.ENVIRONMENT_ID }}
          APP_IDENTITY_ID: ${{ vars.APP_IDENTITY_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          QDRANT_HTTP: ${{ vars.QDRANT_HTTP }}
          # Optional: leave unset to use the defaults in render_containerapp.py
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY4: ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          LLAMA_PARSER: ${{ secrets.LLAMA_PARSER }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPSPILOT_ADMIN_PASSWORD: ${{ secrets.OPSPILOT_ADMIN_PASSWORD }}
          OPSPILOT_DEMO_PASSWORD: ${{ secrets.OPSPILOT_DEMO_PASSWORD }}
        run: |
          pip install pyyaml
          python deploy/render_containerapp.py containerapp.yaml

      - name: Create or update the Container App
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          APP: ${{ vars.APP_NAME }}
        run: |
          az extension add --name containerapp --upgrade --yes
          if az containerapp show -n "$APP" -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n "$APP" -g "$RG" --yaml containerapp.yaml -o none
          else
            az containerapp create -n "$APP" -g "$RG" --yaml containerapp.yaml -o none
          fi
          rm -f containerapp.yaml

      # /readyz is 200 only when docs + sql + ops are all up, so this proves the whole stack started (cold start can
      # take several minutes while the docs server loads its models).
      - name: Smoke test
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          APP: ${{ vars.APP_NAME }}
        run: |
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "URL: https://$FQDN"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "https://$FQDN/readyz"; then
              echo; echo "Deployed: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo " not ready yet ($i/40)"; sleep 15
          done
          echo "App did not become ready in 10 minutes"; exit 1
